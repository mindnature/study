name: Validate Skill
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Local storage regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build distributable Skill ZIP
        run: python scripts/build_release.py
      - name: Validate Skill package and manual scenario schema
        run: python scripts/validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: zhixue-agent-skill-v0.2.0
          path: dist/zhixue-agent-skill-v0.2.0.zip