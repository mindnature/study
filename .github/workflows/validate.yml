name: Validate Skill
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_release.py
      - run: python scripts/validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: zhixue-agent-skill
          path: dist/*.zip